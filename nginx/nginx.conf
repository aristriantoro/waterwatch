worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 6M;   # sedikit di atas 5 MB untuk error handling

    # Kompresi gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        # ── Header Keamanan ──────────────────────────────────
        add_header X-Content-Type-Options    "nosniff"                           always;
        add_header X-Frame-Options           "DENY"                              always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
        add_header X-XSS-Protection          "1; mode=block"                     always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';"
            always;

        # ── API – Proxy ke Backend Rust ──────────────────────
        location /api/ {
            proxy_pass         http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Health check endpoint ────────────────────────────
        location = /health {
            proxy_pass         http://app:8080;
            proxy_set_header   Host $host;
        }

        # ── File Statis Frontend ─────────────────────────────
        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── Halaman HTML (SPA-like routing) ──────────────────
        # Halaman publik
        location = / {
            root /app/static;
            try_files /index.html =404;
        }

        location = /login.html {
            root /app/static;
            try_files /login.html =404;
        }

        location = /register.html {
            root /app/static;
            try_files /register.html =404;
        }

        # Halaman warga
        location /warga/ {
            root /app/static;
            try_files $uri $uri.html =404;
        }

        # Halaman admin
        location /admin/ {
            root /app/static;
            try_files $uri $uri.html =404;
        }

        # Default: coba file statis, fallback ke index
        location / {
            root /app/static;
            try_files $uri $uri/ /index.html;
        }

        # ── Error Pages ──────────────────────────────────────
        error_page 404 /404.html;
        location = /404.html {
            root /app/static;
            internal;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /app/static;
            internal;
        }
    }
}

