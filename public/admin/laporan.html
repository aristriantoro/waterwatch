<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WaterWatch – Laporan Masuk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <link rel="stylesheet" href="/static/css/tokens.css"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body style="background:var(--ww-bg)">

<div class="d-flex">
  <!-- Sidebar desktop -->
  <aside class="ww-sidebar d-none d-md-flex flex-column">
    <div class="ww-sidebar-brand">
      <span class="material-symbols-outlined align-middle me-1">water_drop</span>WaterWatch
      <div class="small text-muted fw-normal mt-1" style="font-size:.7rem">Admin Panel</div>
    </div>
    <nav class="ww-sidebar-nav">
      <a href="/admin/dashboard.html" class="ww-sidebar-link">
        <span class="material-symbols-outlined">dashboard</span>Dashboard
      </a>
      <a href="/admin/laporan.html" class="ww-sidebar-link active">
        <span class="material-symbols-outlined">list_alt</span>Laporan Masuk
      </a>
      <a href="/admin/profil.html" class="ww-sidebar-link">
        <span class="material-symbols-outlined">person</span>Profil
      </a>
    </nav>
    <div class="p-3 border-top">
      <button class="btn btn-outline-danger btn-sm w-100" id="logout-btn">
        <span class="material-symbols-outlined align-middle me-1">logout</span>Keluar
      </button>
    </div>
  </aside>

  <div class="ww-main-with-sidebar flex-grow-1 d-flex flex-column">
    <nav class="navbar bg-white border-bottom px-3">
      <span class="navbar-brand fw-semibold mb-0 d-md-none" style="color:var(--ww-primary)">
        <span class="material-symbols-outlined align-middle me-1">water_drop</span>WaterWatch
      </span>
      <span class="ms-auto text-muted small" id="admin-name"></span>
    </nav>

    <main class="p-3 p-md-4 flex-grow-1">
      <h4 class="fw-bold mb-4">Laporan Masuk</h4>

      <!-- Filter bar -->
      <div class="ww-card mb-4">
        <div class="row g-2">
          <div class="col-12 col-md-2">
            <label class="form-label small fw-medium">Status</label>
            <select id="f-status" class="form-select form-select-sm">
              <option value="">Semua Status</option>
              <option value="menunggu">Menunggu</option>
              <option value="diproses">Diproses</option>
              <option value="selesai">Selesai</option>
            </select>
          </div>
          <div class="col-12 col-md-2">
            <label class="form-label small fw-medium">Kategori</label>
            <select id="f-kategori" class="form-select form-select-sm">
              <option value="">Semua Kategori</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-medium">Dari Tanggal</label>
            <input type="date" id="f-dari" class="form-control form-control-sm"/>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-medium">Sampai Tanggal</label>
            <input type="date" id="f-sampai" class="form-control form-control-sm"/>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small fw-medium">Kata Kunci</label>
            <input type="search" id="f-q" class="form-control form-control-sm" placeholder="Cari deskripsi / lokasi..."/>
          </div>
          <div class="col-12 col-md-1 d-flex align-items-end gap-1">
            <button class="btn btn-primary btn-sm w-100" id="filter-btn">Filter</button>
          </div>
        </div>
        <div class="mt-2">
          <button class="btn btn-link btn-sm p-0 text-decoration-none" id="reset-btn">
            <span class="material-symbols-outlined align-middle" style="font-size:.9rem">restart_alt</span> Reset
          </button>
        </div>
      </div>

      <div id="error-banner"></div>

      <!-- Tabel desktop / Kartu mobile -->
      <div class="ww-card">
        <div id="content">
          <div class="placeholder-glow">
            <div class="placeholder col-12 rounded mb-2" style="height:48px"></div>
            <div class="placeholder col-12 rounded mb-2" style="height:48px"></div>
            <div class="placeholder col-12 rounded" style="height:48px"></div>
          </div>
        </div>
        <nav id="pagination" class="mt-3"></nav>
      </div>
    </main>

    <div id="ww-footer-container"></div>
  </div>
</div>

<!-- Bottom nav mobile -->
<nav class="ww-bottom-nav d-md-none fixed-bottom">
  <div class="d-flex justify-content-around align-items-center h-100 px-2">
    <a href="/admin/dashboard.html" class="ww-nav-item">
      <span class="material-symbols-outlined">dashboard</span><small>Dashboard</small>
    </a>
    <a href="/admin/laporan.html" class="ww-nav-item active">
      <span class="material-symbols-outlined">list_alt</span><small>Laporan</small>
    </a>
    <a href="/admin/profil.html" class="ww-nav-item">
      <span class="material-symbols-outlined">person</span><small>Profil</small>
    </a>
  </div>
</nav>

<div class="toast align-items-center border-0 position-fixed bottom-0 end-0 m-3" role="alert" id="app-toast" style="z-index:9999">
  <div class="d-flex"><div class="toast-body"><span id="toast-message"></span></div>
  <button class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Tutup"></button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/guard.js"></script>
<script src="/static/js/layout.js"></script>
<script>
  guard.requireAuth('admin');
  const user = api.getUser();
  if (user) document.getElementById('admin-name').textContent = user.nama;
  document.getElementById('logout-btn')?.addEventListener('click', () => { api.clearSession(); location.href='/'; });

  let currentPage = 1;

  // Muat kategori ke dropdown filter
  async function loadCategories() {
    try {
      const d = await api.get('/categories');
      const sel = document.getElementById('f-kategori');
      d.data.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.nama_kategori; // textContent aman
        sel.appendChild(opt);
      });
    } catch {}
  }
  loadCategories();

  function buildQuery() {
    const qs = new URLSearchParams({ page: currentPage, per_page: 10 });
    const status  = document.getElementById('f-status').value;
    const kat     = document.getElementById('f-kategori').value;
    const dari    = document.getElementById('f-dari').value;
    const sampai  = document.getElementById('f-sampai').value;
    const q       = document.getElementById('f-q').value.trim();
    if (status)  qs.set('status', status);
    if (kat)     qs.set('kategori_id', kat);
    if (dari)    qs.set('tanggal_dari', dari);
    if (sampai)  qs.set('tanggal_sampai', sampai);
    if (q)       qs.set('q', q);
    return qs;
  }

  async function loadReports() {
    document.getElementById('content').innerHTML = utils.skeleton(5);
    utils.clearBanner('error-banner');
    try {
      const d = await api.get(`/admin/reports?${buildQuery()}`);

      if (!d.data.length) {
        document.getElementById('content').innerHTML = `
          <div class="text-center py-5 text-muted">
            <span class="material-symbols-outlined d-block mb-2" style="font-size:3rem">search_off</span>
            <p class="mb-0">Tidak ada laporan yang sesuai filter</p>
          </div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      // Tabel desktop
      const tableHtml = `
        <div class="table-responsive d-none d-md-block">
          <table class="table table-hover table-sm align-middle mb-0">
            <thead class="table-light"><tr>
              <th>Nomor</th><th>Pelapor</th><th>Kategori</th><th>Lokasi</th><th>Status</th><th>Tanggal</th><th></th>
            </tr></thead>
            <tbody>${d.data.map(r => `<tr>
              <td class="fw-medium small">${utils.escapeHtml(r.nomor)}</td>
              <td class="small">${utils.escapeHtml(r.user_nama)}</td>
              <td class="small">${utils.escapeHtml(r.kategori)}</td>
              <td class="small" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${utils.escapeHtml(r.lokasi)}</td>
              <td>${utils.statusBadgeHtml(r.status)}</td>
              <td class="small text-muted">${utils.formatDateShort(r.created_at)}</td>
              <td><a href="/admin/detail-laporan.html?id=${encodeURIComponent(r.id)}" class="btn btn-sm btn-outline-primary">Detail</a></td>
            </tr>`).join('')}</tbody>
          </table>
        </div>`;

      // Kartu mobile
      const cardsHtml = `<div class="d-md-none">${d.data.map(r => `
        <div class="ww-report-card">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <div class="ww-report-card-title">${utils.escapeHtml(r.nomor)}</div>
              <div class="ww-report-card-meta">${utils.escapeHtml(r.user_nama)} &bull; ${utils.escapeHtml(r.kategori)}</div>
            </div>
            ${utils.statusBadgeHtml(r.status)}
          </div>
          <div class="text-muted small mb-2">
            <span class="material-symbols-outlined align-middle" style="font-size:.9rem">location_on</span>
            ${utils.escapeHtml(r.lokasi)}
          </div>
          <div class="text-muted small mb-3">${utils.formatDateShort(r.created_at)}</div>
          <a href="/admin/detail-laporan.html?id=${encodeURIComponent(r.id)}" class="btn btn-outline-primary btn-sm w-100">Detail</a>
        </div>`).join('')}</div>`;

      document.getElementById('content').innerHTML = tableHtml + cardsHtml;
      renderPagination(d.meta);
    } catch (err) {
      utils.showBanner('error-banner', err?.error?.message || 'Gagal memuat laporan.');
      document.getElementById('content').innerHTML = '';
    }
  }

  function renderPagination(meta) {
    const nav = document.getElementById('pagination');
    if (meta.total_pages <= 1) { nav.innerHTML = ''; return; }
    nav.innerHTML = `<ul class="pagination justify-content-center mb-0">
      <li class="page-item ${meta.page<=1?'disabled':''}">
        <button class="page-link" onclick="changePage(${meta.page-1})">
          <span class="material-symbols-outlined" style="font-size:1rem">chevron_left</span>
        </button></li>
      <li class="page-item disabled"><span class="page-link">${meta.page} / ${meta.total_pages} &nbsp;<small class="text-muted">(${meta.total} laporan)</small></span></li>
      <li class="page-item ${meta.page>=meta.total_pages?'disabled':''}">
        <button class="page-link" onclick="changePage(${meta.page+1})">
          <span class="material-symbols-outlined" style="font-size:1rem">chevron_right</span>
        </button></li>
    </ul>`;
  }

  function changePage(p) { currentPage = p; loadReports(); }

  document.getElementById('filter-btn').addEventListener('click', () => { currentPage = 1; loadReports(); });
  document.getElementById('reset-btn').addEventListener('click', () => {
    ['f-status','f-kategori','f-dari','f-sampai','f-q'].forEach(id => {
      const el = document.getElementById(id);
      if (el.tagName === 'SELECT') el.selectedIndex = 0;
      else el.value = '';
    });
    currentPage = 1; loadReports();
  });
  // Filter on Enter di searchbox
  document.getElementById('f-q').addEventListener('keydown', e => { if (e.key === 'Enter') { currentPage=1; loadReports(); } });

  loadReports();
</script>
</body>
</html>
