<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WaterWatch – Detail Laporan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <link rel="stylesheet" href="/static/css/tokens.css"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
  <style>body{padding-bottom:calc(var(--ww-bottom-nav-height) + 1rem)}</style>
</head>
<body style="background:var(--ww-bg)">

  <nav class="navbar bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <a href="/warga/riwayat.html" class="btn btn-sm btn-outline-secondary">
        <span class="material-symbols-outlined align-middle" style="font-size:1rem">arrow_back</span> Kembali
      </a>
      <span class="navbar-brand fw-semibold mb-0 mx-auto">Detail Laporan</span>
      <div style="width:80px"></div>
    </div>
  </nav>

  <main class="container py-3" style="max-width:640px" id="main-content">
    <div id="error-banner"></div>
    <div id="content">
      <!-- Skeleton loading -->
      <div class="placeholder-glow">
        <div class="placeholder col-6 mb-3 rounded" style="height:24px"></div>
        <div class="placeholder col-12 mb-2 rounded" style="height:16px"></div>
        <div class="placeholder col-8 mb-4 rounded" style="height:16px"></div>
        <div class="placeholder col-12 rounded" style="height:120px"></div>
      </div>
    </div>
  </main>

  <nav class="ww-bottom-nav d-md-none fixed-bottom">
    <div class="d-flex justify-content-around align-items-center h-100 px-2">
      <a href="/warga/riwayat.html" class="ww-nav-item active">
        <span class="material-symbols-outlined">history</span><small>Riwayat</small>
      </a>
      <a href="/warga/buat-laporan.html" class="ww-nav-item">
        <span class="material-symbols-outlined">add_circle</span><small>Laporan</small>
      </a>
      <a href="/warga/profil.html" class="ww-nav-item">
        <span class="material-symbols-outlined">person</span><small>Profil</small>
      </a>
    </div>
  </nav>

  <div id="ww-footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/guard.js"></script>
  <script src="/static/js/layout.js"></script>
  <script>
    guard.requireAuth();

    const id = new URLSearchParams(location.search).get('id');
    if (!id) { location.href = '/warga/riwayat.html'; }

    async function loadDetail() {
      try {
        const r = await api.get(`/reports/${encodeURIComponent(id)}`);
        renderDetail(r);
      } catch (err) {
        utils.showBanner('error-banner', err?.error?.message || 'Laporan tidak ditemukan.');
        document.getElementById('content').innerHTML = '';
      }
    }

    function renderDetail(r) {
      const fotoHtml = r.foto
        ? `<img src="/api/v1/reports/${encodeURIComponent(r.id)}/foto" alt="Foto laporan"
               class="img-fluid rounded mb-3 w-100" style="max-height:300px;object-fit:cover"
               onerror="this.style.display='none'">`
        : '';

      const koordinatHtml = (r.latitude != null && r.longitude != null)
        ? `<div class="mb-2 small text-muted"><span class="material-symbols-outlined align-middle me-1" style="font-size:1rem">my_location</span>${r.latitude}, ${r.longitude}</div>`
        : '';

      const riwayatHtml = r.riwayat.map((u, i) => `
        <div class="ww-timeline-item">
          <div class="ww-timeline-dot"></div>
          <div class="ww-timeline-content">
            <div class="d-flex align-items-center gap-2 mb-1">
              ${utils.statusBadgeHtml(u.status)}
              <span class="ww-timeline-time">${utils.formatDate(u.updated_at)}</span>
            </div>
            ${u.keterangan ? `<p class="mb-1 small">${utils.escapeHtml(u.keterangan)}</p>` : ''}
            ${u.updated_by_nama ? `<small class="text-muted">oleh ${utils.escapeHtml(u.updated_by_nama)}</small>` : ''}
          </div>
        </div>`).join('');

      document.getElementById('content').innerHTML = `
        <div class="ww-card mb-3">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <div class="fw-bold mb-1">${utils.escapeHtml(r.nomor)}</div>
              <div class="text-muted small">${utils.escapeHtml(r.kategori)}</div>
            </div>
            ${utils.statusBadgeHtml(r.status)}
          </div>
          ${fotoHtml}
          <h6 class="fw-semibold mb-1">Deskripsi</h6>
          <p class="mb-3">${utils.escapeHtml(r.deskripsi)}</p>
          <h6 class="fw-semibold mb-1">Lokasi</h6>
          <div class="mb-1 small"><span class="material-symbols-outlined align-middle me-1" style="font-size:1rem">location_on</span>${utils.escapeHtml(r.lokasi)}</div>
          ${r.wilayah ? `<div class="mb-1 small text-muted">${utils.escapeHtml(r.wilayah)}</div>` : ''}
          ${koordinatHtml}
          <div class="text-muted small mt-2">Dilaporkan: ${utils.formatDate(r.created_at)}</div>
        </div>
        <div class="ww-card">
          <h6 class="fw-semibold mb-3">Riwayat Status</h6>
          <div class="ww-timeline">${riwayatHtml}</div>
        </div>`;
    }

    loadDetail();
  </script>
</body>
</html>
