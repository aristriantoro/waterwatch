<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WaterWatch – Daftar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <link rel="stylesheet" href="/static/css/tokens.css"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body class="d-flex flex-column min-vh-100" style="background:var(--ww-bg)">

  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/" style="color:var(--ww-primary)">
        <span class="material-symbols-outlined align-middle me-1">water_drop</span>WaterWatch
      </a>
    </div>
  </nav>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-sm border-0 w-100" style="max-width:440px">
      <div class="card-body p-4">
        <h2 class="fw-bold mb-1 text-center">Daftar Akun</h2>
        <p class="text-muted text-center small mb-4">Bergabung untuk melaporkan gangguan air</p>

        <div id="error-banner"></div>

        <form id="register-form" novalidate>
          <div class="mb-3">
            <label for="nama" class="form-label fw-medium">Nama Lengkap</label>
            <input type="text" id="nama" class="form-control" placeholder="Nama lengkap Anda"
                   required minlength="2" maxlength="100" autocomplete="name"/>
            <div class="invalid-feedback" id="nama-err">Nama wajib diisi (2–100 karakter).</div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label fw-medium">Email</label>
            <input type="email" id="email" class="form-control" placeholder="email@contoh.com"
                   required autocomplete="email"/>
            <div class="invalid-feedback" id="email-err">Format email tidak valid.</div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-medium">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Minimal 8 karakter"
                   required minlength="8" autocomplete="new-password"/>
            <div class="invalid-feedback" id="password-err">Password minimal 8 karakter.</div>
          </div>
          <button type="submit" id="submit-btn" class="btn btn-primary w-100">
            <span id="btn-text">Daftar</span>
            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
          </button>
        </form>
        <p class="text-center mt-3 small">Sudah punya akun? <a href="/login.html">Masuk di sini</a></p>
      </div>
    </div>
  </main>

  <div id="ww-footer-container"></div>

  <!-- Toast sukses -->
  <div class="toast align-items-center text-bg-success border-0 position-fixed bottom-0 end-0 m-3" role="alert" id="app-toast" style="z-index:9999">
    <div class="d-flex">
      <div class="toast-body"><span class="material-symbols-outlined align-middle me-1">check_circle</span><span id="toast-message"></span></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Tutup"></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/guard.js"></script>
  <script src="/static/js/layout.js"></script>
  <script>
    guard.redirectIfLoggedIn();

    function setFieldError(fieldId, errId, message) {
      const el = document.getElementById(fieldId);
      el.classList.add('is-invalid');
      if (errId && message) document.getElementById(errId).textContent = message;
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      utils.clearBanner('error-banner');
      // Reset validasi
      ['nama','email','password'].forEach(id => document.getElementById(id).classList.remove('is-invalid'));

      const nama     = document.getElementById('nama').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      let valid = true;
      if (nama.length < 2) { setFieldError('nama','nama-err','Nama wajib diisi (2–100 karakter).'); valid=false; }
      if (!email.includes('@')) { setFieldError('email','email-err','Format email tidak valid.'); valid=false; }
      if (password.length < 8) { setFieldError('password','password-err','Password minimal 8 karakter.'); valid=false; }
      if (!valid) return;

      const btn     = document.getElementById('submit-btn');
      const spinner = document.getElementById('btn-spinner');
      const text    = document.getElementById('btn-text');
      btn.disabled  = true;
      spinner.classList.remove('d-none');
      text.textContent = 'Mendaftar...';

      try {
        await api.post('/auth/register', { nama, email, password });
        utils.showToast('Registrasi berhasil! Silakan masuk.');
        setTimeout(() => window.location.href = '/login.html', 1500);
      } catch (err) {
        const details = err?.error?.details || [];
        if (details.length) {
          details.forEach(d => {
            if (d.field === 'email') setFieldError('email', 'email-err', d.message || 'Email tidak valid.');
            else if (d.field === 'password') setFieldError('password', 'password-err', d.message || 'Password tidak valid.');
            else if (d.field === 'nama') setFieldError('nama', 'nama-err', d.message || 'Nama tidak valid.');
          });
        } else {
          utils.showBanner('error-banner', err?.error?.message || 'Terjadi kesalahan. Coba lagi.');
        }
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
        text.textContent = 'Daftar';
      }
    });
  </script>
</body>
</html>
