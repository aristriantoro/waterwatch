<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WaterWatch – Masuk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <link rel="stylesheet" href="/static/css/tokens.css"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body class="d-flex flex-column min-vh-100" style="background:var(--ww-bg)">

  <!-- Navbar minimal -->
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/" style="color:var(--ww-primary)">
        <span class="material-symbols-outlined align-middle me-1">water_drop</span>WaterWatch
      </a>
    </div>
  </nav>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-sm border-0 w-100" style="max-width:420px">
      <div class="card-body p-4">
        <h2 class="fw-bold mb-1 text-center">Masuk</h2>
        <p class="text-muted text-center small mb-4">Selamat datang kembali di WaterWatch</p>

        <!-- Banner error -->
        <div id="error-banner"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label fw-medium">Email</label>
            <input type="email" id="email" name="email" class="form-control"
                   placeholder="email@contoh.com" required autocomplete="email"/>
            <div class="invalid-feedback">Email tidak valid.</div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-medium">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="Minimal 8 karakter" required autocomplete="current-password"/>
            <div class="invalid-feedback">Password wajib diisi.</div>
          </div>
          <button type="submit" id="submit-btn" class="btn btn-primary w-100">
            <span id="btn-text">Masuk</span>
            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
          </button>
        </form>

        <!-- Kotak Simulasi Interaktif 1-Klik -->
        <div class="mt-4 pt-3 border-top">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="small fw-bold" style="color:var(--ww-primary)">
              <span class="material-symbols-outlined align-middle me-1" style="font-size:1.1rem">play_circle</span>Mode Simulasi Interaktif
            </span>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Demo</span>
          </div>
          <p class="text-muted small mb-2" style="font-size:.78rem">Pilih peran untuk langsung mencoba tanpa perlu mengetik akun:</p>
          <div class="d-grid gap-2">
            <button type="button" id="btn-demo-warga" class="btn btn-outline-primary btn-sm d-flex align-items-center justify-content-between py-2">
              <span><span class="material-symbols-outlined align-middle me-1" style="font-size:1.1rem">person</span>Masuk sebagai <strong>Warga</strong> (Budi Santoso)</span>
              <span class="material-symbols-outlined" style="font-size:1rem">arrow_forward</span>
            </button>
            <button type="button" id="btn-demo-admin" class="btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-between py-2">
              <span><span class="material-symbols-outlined align-middle me-1" style="font-size:1.1rem">admin_panel_settings</span>Masuk sebagai <strong>Admin PDAM</strong></span>
              <span class="material-symbols-outlined" style="font-size:1rem">arrow_forward</span>
            </button>
          </div>
        </div>

        <p class="text-center mt-3 mb-0 small">
          Belum punya akun? <a href="/register.html">Daftar di sini</a>
        </p>
      </div>
    </div>
  </main>

  <div id="ww-footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/guard.js"></script>
  <script src="/static/js/layout.js"></script>
  <script>
    guard.redirectIfLoggedIn();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      utils.clearBanner('error-banner');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        document.getElementById('login-form').classList.add('was-validated');
        return;
      }

      const btn     = document.getElementById('submit-btn');
      const spinner = document.getElementById('btn-spinner');
      const text    = document.getElementById('btn-text');
      btn.disabled  = true;
      spinner.classList.remove('d-none');
      text.textContent = 'Memproses...';

      try {
        const data = await api.post('/auth/login', { email, password });
        api.setToken(data.token);
        api.setUser(data.user);
        // Redirect sesuai role
        window.location.href = data.user.role === 'admin'
          ? '/admin/dashboard.html'
          : '/warga/riwayat.html';
      } catch (err) {
        const msg = err?.error?.message || 'Terjadi kesalahan. Coba lagi.';
        utils.showBanner('error-banner', msg);
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
        text.textContent = 'Masuk';
      }
    });
    // 1-Klik Simulasi Login
    document.getElementById('btn-demo-warga')?.addEventListener('click', async () => {
      document.getElementById('email').value = 'warga1@example.com';
      document.getElementById('password').value = 'Warga@1234!';
      document.getElementById('submit-btn').click();
    });

    document.getElementById('btn-demo-admin')?.addEventListener('click', async () => {
      document.getElementById('email').value = 'admin@waterwatch.id';
      document.getElementById('password').value = 'Admin@1234!';
      document.getElementById('submit-btn').click();
    });
  </script>
</body>
</html>
