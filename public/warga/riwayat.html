<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WaterWatch – Riwayat Laporan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <link rel="stylesheet" href="/static/css/tokens.css"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
  <style>
    body { padding-bottom: calc(var(--ww-bottom-nav-height) + 1rem); }
  </style>
</head>
<body style="background:var(--ww-bg)">

  <!-- Top bar -->
  <nav class="navbar bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <span class="navbar-brand fw-bold mb-0" style="color:var(--ww-primary)">
        <span class="material-symbols-outlined align-middle me-1">water_drop</span>WaterWatch
      </span>
      <span id="user-name" class="text-muted small"></span>
    </div>
  </nav>

  <main class="container py-3" id="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-semibold mb-0">Riwayat Laporan Saya</h5>
      <a href="/warga/buat-laporan.html" class="btn btn-primary btn-sm">
        <span class="material-symbols-outlined align-middle" style="font-size:1rem">add</span> Buat
      </a>
    </div>

    <!-- Filter status -->
    <div class="d-flex gap-2 mb-3 overflow-auto pb-1" id="filter-tabs">
      <button class="btn btn-primary btn-sm filter-btn" data-status="">Semua</button>
      <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="menunggu">Menunggu</button>
      <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="diproses">Diproses</button>
      <button class="btn btn-outline-secondary btn-sm filter-btn" data-status="selesai">Selesai</button>
    </div>

    <!-- Banner error -->
    <div id="error-banner"></div>

    <!-- Konten: loading / kosong / data -->
    <div id="content"></div>

    <!-- Pagination -->
    <nav id="pagination" class="mt-3" aria-label="Halaman laporan"></nav>
  </main>

  <!-- Bottom nav mobile -->
  <nav class="ww-bottom-nav d-md-none fixed-bottom" aria-label="Navigasi utama">
    <div class="d-flex justify-content-around align-items-center h-100 px-2">
      <a href="/warga/riwayat.html" class="ww-nav-item active">
        <span class="material-symbols-outlined">history</span><small>Riwayat</small>
      </a>
      <a href="/warga/buat-laporan.html" class="ww-nav-item">
        <span class="material-symbols-outlined">add_circle</span><small>Laporan</small>
      </a>
      <a href="/warga/profil.html" class="ww-nav-item">
        <span class="material-symbols-outlined">person</span><small>Profil</small>
      </a>
    </div>
  </nav>

  <div id="ww-footer-container"></div>

  <div class="toast align-items-center border-0 position-fixed bottom-0 end-0 m-3" role="alert" id="app-toast" style="z-index:9999">
    <div class="d-flex"><div class="toast-body"><span id="toast-message"></span></div>
    <button class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Tutup"></button></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/guard.js"></script>
  <script src="/static/js/layout.js"></script>
  <script>
    const payload = guard.requireAuth('masyarakat');
    if (payload) {
      const user = api.getUser();
      if (user) {
        const el = document.getElementById('user-name');
        el.textContent = user.nama; // textContent aman
      }
    }

    let currentPage = 1;
    let currentStatus = '';

    // Filter tab
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = 'btn btn-outline-secondary btn-sm filter-btn';
        });
        btn.className = 'btn btn-primary btn-sm filter-btn';
        currentStatus = btn.dataset.status;
        currentPage = 1;
        loadReports();
      });
    });

    async function loadReports() {
      const content = document.getElementById('content');
      content.innerHTML = utils.skeleton(5);
      utils.clearBanner('error-banner');

      try {
        const qs = new URLSearchParams({ page: currentPage, per_page: 10 });
        if (currentStatus) qs.set('status', currentStatus);
        const data = await api.get(`/reports/mine?${qs}`);

        if (!data.data.length) {
          content.innerHTML = `
            <div class="text-center py-5 text-muted">
              <span class="material-symbols-outlined d-block mb-2" style="font-size:3rem">inbox</span>
              <p class="mb-0">Belum ada laporan</p>
              <a href="/warga/buat-laporan.html" class="btn btn-primary btn-sm mt-3">Buat Laporan Pertama</a>
            </div>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        content.innerHTML = data.data.map(r => `
          <div class="ww-report-card">
            <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
              <div>
                <div class="ww-report-card-title">${utils.escapeHtml(r.nomor)}</div>
                <div class="ww-report-card-meta">${utils.escapeHtml(r.kategori)} &bull; ${utils.formatDateShort(r.created_at)}</div>
              </div>
              ${utils.statusBadgeHtml(r.status)}
            </div>
            <p class="small text-muted mb-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">
              ${utils.escapeHtml(r.deskripsi)}
            </p>
            <div class="d-flex align-items-center gap-1 text-muted small mb-3">
              <span class="material-symbols-outlined" style="font-size:.9rem">location_on</span>
              <span>${utils.escapeHtml(r.lokasi)}</span>
            </div>
            <a href="/warga/detail-laporan.html?id=${encodeURIComponent(r.id)}" class="btn btn-outline-primary btn-sm w-100">
              Lihat Detail
            </a>
          </div>`).join('');

        renderPagination(data.meta);
      } catch (err) {
        utils.showBanner('error-banner', err?.error?.message || 'Gagal memuat data. Coba lagi.');
        content.innerHTML = '';
      }
    }

    function renderPagination(meta) {
      const nav = document.getElementById('pagination');
      if (meta.total_pages <= 1) { nav.innerHTML = ''; return; }
      nav.innerHTML = `<ul class="pagination justify-content-center">
        <li class="page-item ${meta.page<=1?'disabled':''}">
          <button class="page-link" onclick="changePage(${meta.page-1})">
            <span class="material-symbols-outlined" style="font-size:1rem">chevron_left</span>
          </button>
        </li>
        <li class="page-item disabled"><span class="page-link">${meta.page} / ${meta.total_pages}</span></li>
        <li class="page-item ${meta.page>=meta.total_pages?'disabled':''}">
          <button class="page-link" onclick="changePage(${meta.page+1})">
            <span class="material-symbols-outlined" style="font-size:1rem">chevron_right</span>
          </button>
        </li>
      </ul>`;
    }

    function changePage(p) { currentPage = p; loadReports(); }

    loadReports();
  </script>
</body>
</html>
