<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WaterWatch – Buat Laporan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <link rel="stylesheet" href="/static/css/tokens.css"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body style="background:var(--ww-bg)">

  <!-- Header linear (tanpa bottom nav) -->
  <nav class="navbar bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <a href="/warga/riwayat.html" class="btn btn-sm btn-outline-secondary">
        <span class="material-symbols-outlined align-middle" style="font-size:1rem">close</span> Batal
      </a>
      <span class="navbar-brand fw-semibold mb-0 mx-auto">Buat Laporan</span>
      <div style="width:70px"></div>
    </div>
  </nav>

  <main class="container py-4" style="max-width:640px">
    <div id="error-banner"></div>

    <form id="report-form" novalidate>
      <!-- Kategori -->
      <div class="mb-3">
        <label for="kategori_id" class="form-label fw-medium">
          Kategori Gangguan <span class="text-danger">*</span>
        </label>
        <select id="kategori_id" class="form-select" required>
          <option value="">Memuat kategori...</option>
        </select>
        <div class="invalid-feedback" id="kategori-err">Pilih kategori.</div>
      </div>

      <!-- Deskripsi -->
      <div class="mb-3">
        <label for="deskripsi" class="form-label fw-medium">
          Deskripsi <span class="text-danger">*</span>
        </label>
        <textarea id="deskripsi" class="form-control" rows="4"
                  placeholder="Jelaskan gangguan secara detail (10–1000 karakter)"
                  required minlength="10" maxlength="1000"></textarea>
        <div class="d-flex justify-content-between mt-1">
          <div class="invalid-feedback d-block" id="deskripsi-err" style="display:none!important"></div>
          <small class="text-muted ms-auto"><span id="char-count">0</span>/1000</small>
        </div>
      </div>

      <!-- Lokasi -->
      <div class="mb-3">
        <label for="lokasi" class="form-label fw-medium">
          Alamat Lokasi <span class="text-danger">*</span>
        </label>
        <input type="text" id="lokasi" class="form-control"
               placeholder="Jl. Contoh No. 10, Kelurahan..." required/>
        <div class="invalid-feedback" id="lokasi-err">Lokasi wajib diisi.</div>
      </div>

      <!-- Wilayah -->
      <div class="mb-3">
        <label for="wilayah" class="form-label fw-medium">Wilayah / Kelurahan</label>
        <input type="text" id="wilayah" class="form-control" placeholder="Kelurahan / Kecamatan (opsional)"/>
      </div>

      <!-- Koordinat (opsional, collapsible) -->
      <div class="mb-3">
        <button type="button" class="btn btn-link p-0 text-decoration-none small"
                data-bs-toggle="collapse" data-bs-target="#koordinat-panel">
          <span class="material-symbols-outlined align-middle" style="font-size:1rem">add_circle</span>
          Tambah Koordinat (opsional)
        </button>
        <div class="collapse" id="koordinat-panel">
          <div class="row g-2 mt-1">
            <div class="col-6">
              <label for="latitude" class="form-label small">Latitude</label>
              <input type="number" id="latitude" class="form-control form-control-sm"
                     placeholder="-5.4294" step="any" min="-90" max="90"/>
              <div class="invalid-feedback" id="lat-err">Harus antara -90 dan 90.</div>
            </div>
            <div class="col-6">
              <label for="longitude" class="form-label small">Longitude</label>
              <input type="number" id="longitude" class="form-control form-control-sm"
                     placeholder="105.2610" step="any" min="-180" max="180"/>
              <div class="invalid-feedback" id="lng-err">Harus antara -180 dan 180.</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Upload foto -->
      <div class="mb-4">
        <label for="foto" class="form-label fw-medium">Foto Bukti (opsional)</label>
        <input type="file" id="foto" class="form-control" accept="image/jpeg,image/png"/>
        <div class="form-text">JPG atau PNG, maksimal 5 MB.</div>
        <div class="invalid-feedback d-block" id="foto-err" style="display:none!important"></div>
        <!-- Preview -->
        <div id="foto-preview" class="mt-2 d-none">
          <img id="preview-img" src="" alt="Preview foto" class="rounded"
               style="max-height:200px;max-width:100%;object-fit:contain"/>
          <button type="button" class="btn btn-sm btn-outline-danger ms-2" id="hapus-foto">Hapus</button>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2">
        <span id="btn-text">Kirim Laporan</span>
        <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
      </button>
    </form>
  </main>

  <!-- Modal sukses -->
  <div class="modal fade" id="sukses-modal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0">
        <div class="modal-body text-center p-5">
          <span class="material-symbols-outlined mb-3 d-block" style="font-size:4rem;color:var(--ww-success)">check_circle</span>
          <h5 class="fw-bold mb-1">Laporan Berhasil Dikirim!</h5>
          <p class="text-muted small mb-1">Nomor laporan Anda:</p>
          <p class="fw-bold fs-5 mb-3" id="nomor-laporan"></p>
          <p class="text-muted small mb-4">Status: <span class="ww-badge ww-badge-menunggu"><span class="material-symbols-outlined" style="font-size:.9rem">schedule</span>Menunggu</span></p>
          <a href="/warga/riwayat.html" class="btn btn-primary w-100">Lihat Riwayat Laporan</a>
        </div>
      </div>
    </div>
  </div>

  <div id="ww-footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/guard.js"></script>
  <script src="/static/js/layout.js"></script>
  <script>
    guard.requireAuth('masyarakat');

    // Muat kategori
    async function loadCategories() {
      try {
        const data = await api.get('/categories');
        const sel = document.getElementById('kategori_id');
        sel.innerHTML = '<option value="">-- Pilih Kategori --</option>' +
          data.data.map(c => `<option value="${c.id}">${utils.escapeHtml(c.nama_kategori)}</option>`).join('');
      } catch {
        document.getElementById('kategori_id').innerHTML = '<option value="">Gagal memuat kategori</option>';
      }
    }
    loadCategories();

    // Hitung karakter deskripsi
    document.getElementById('deskripsi').addEventListener('input', function() {
      document.getElementById('char-count').textContent = this.value.length;
    });

    // Preview foto
    document.getElementById('foto').addEventListener('change', function() {
      const file = this.files[0];
      const preview = document.getElementById('foto-preview');
      const errEl = document.getElementById('foto-err');
      errEl.style.display = 'none';
      errEl.textContent = '';

      if (!file) { preview.classList.add('d-none'); return; }
      if (file.size > 5 * 1024 * 1024) {
        errEl.style.display = 'block';
        errEl.textContent = 'File terlalu besar (maks 5 MB).';
        this.value = '';
        preview.classList.add('d-none');
        return;
      }
      const url = URL.createObjectURL(file);
      document.getElementById('preview-img').src = url;
      preview.classList.remove('d-none');
    });

    document.getElementById('hapus-foto').addEventListener('click', () => {
      document.getElementById('foto').value = '';
      document.getElementById('foto-preview').classList.add('d-none');
    });

    // Submit
    document.getElementById('report-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      utils.clearBanner('error-banner');
      // Reset error
      ['kategori-err','deskripsi-err','lokasi-err','lat-err','lng-err','foto-err'].forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.textContent = ''; el.style.display = 'none'; }
      });
      ['kategori_id','deskripsi','lokasi'].forEach(id => document.getElementById(id).classList.remove('is-invalid'));

      const fd = new FormData();
      const kategori_id = document.getElementById('kategori_id').value;
      const deskripsi   = document.getElementById('deskripsi').value.trim();
      const lokasi      = document.getElementById('lokasi').value.trim();
      const wilayah     = document.getElementById('wilayah').value.trim();
      const latitude    = document.getElementById('latitude').value.trim();
      const longitude   = document.getElementById('longitude').value.trim();
      const fotoFile    = document.getElementById('foto').files[0];

      let valid = true;
      if (!kategori_id) {
        document.getElementById('kategori_id').classList.add('is-invalid');
        valid = false;
      }
      if (deskripsi.length < 10) {
        const el = document.getElementById('deskripsi-err');
        el.textContent = 'Deskripsi minimal 10 karakter.'; el.style.display = 'block';
        document.getElementById('deskripsi').classList.add('is-invalid');
        valid = false;
      }
      if (!lokasi) {
        document.getElementById('lokasi').classList.add('is-invalid');
        valid = false;
      }
      if (!valid) return;

      fd.append('kategori_id', kategori_id);
      fd.append('deskripsi', deskripsi);
      fd.append('lokasi', lokasi);
      if (wilayah) fd.append('wilayah', wilayah);
      if (latitude) fd.append('latitude', latitude);
      if (longitude) fd.append('longitude', longitude);
      if (fotoFile) fd.append('foto', fotoFile);

      const btn     = document.getElementById('submit-btn');
      const spinner = document.getElementById('btn-spinner');
      const text    = document.getElementById('btn-text');
      btn.disabled  = true;
      spinner.classList.remove('d-none');
      text.textContent = 'Mengirim...';

      try {
        const res = await api.post('/reports', fd);
        document.getElementById('nomor-laporan').textContent = res.nomor; // textContent aman
        new bootstrap.Modal(document.getElementById('sukses-modal')).show();
      } catch (err) {
        const details = err?.error?.details || [];
        if (details.length) {
          details.forEach(d => {
            const errId = { deskripsi:'deskripsi-err', lokasi:'lokasi-err', latitude:'lat-err', longitude:'lng-err', kategori_id:'kategori-err', foto:'foto-err' }[d.field];
            if (errId) {
              const el = document.getElementById(errId);
              if (el) { el.textContent = d.message || 'Tidak valid.'; el.style.display = 'block'; }
            }
          });
        } else {
          utils.showBanner('error-banner', err?.error?.message || 'Gagal mengirim laporan. Coba lagi.');
        }
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
        text.textContent = 'Kirim Laporan';
      }
    });
  </script>
</body>
</html>
