<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WaterWatch – Profil Saya</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <link rel="stylesheet" href="/static/css/tokens.css"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
  <style>body{padding-bottom:calc(var(--ww-bottom-nav-height) + 1rem)}</style>
</head>
<body style="background:var(--ww-bg)">

  <nav class="navbar bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <span class="navbar-brand fw-bold mb-0" style="color:var(--ww-primary)">
        <span class="material-symbols-outlined align-middle me-1">water_drop</span>WaterWatch
      </span>
    </div>
  </nav>

  <main class="container py-4" style="max-width:480px">
    <div id="content">
      <div class="text-center py-4">
        <div class="placeholder-glow">
          <div class="placeholder rounded-circle mx-auto mb-3" style="width:80px;height:80px"></div>
          <div class="placeholder col-6 mx-auto mb-2 rounded" style="height:20px"></div>
          <div class="placeholder col-8 mx-auto rounded" style="height:16px"></div>
        </div>
      </div>
    </div>
  </main>

  <nav class="ww-bottom-nav d-md-none fixed-bottom">
    <div class="d-flex justify-content-around align-items-center h-100 px-2">
      <a href="/warga/riwayat.html" class="ww-nav-item">
        <span class="material-symbols-outlined">history</span><small>Riwayat</small>
      </a>
      <a href="/warga/buat-laporan.html" class="ww-nav-item">
        <span class="material-symbols-outlined">add_circle</span><small>Laporan</small>
      </a>
      <a href="/warga/profil.html" class="ww-nav-item active">
        <span class="material-symbols-outlined">person</span><small>Profil</small>
      </a>
    </div>
  </nav>

  <div id="ww-footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/guard.js"></script>
  <script src="/static/js/layout.js"></script>
  <script>
    const payload = guard.requireAuth('masyarakat');

    async function loadProfile() {
      try {
        const u = await api.get('/auth/me');
        const content = document.getElementById('content');
        content.innerHTML = `
          <div class="text-center mb-4">
            <div class="d-flex align-items-center justify-content-center bg-primary rounded-circle mx-auto mb-3"
                 style="width:80px;height:80px;background:var(--ww-primary)!important">
              <span class="material-symbols-outlined text-white" style="font-size:2.5rem">person</span>
            </div>
            <h5 class="fw-bold mb-1" id="profile-nama"></h5>
            <div class="text-muted small" id="profile-email"></div>
          </div>
          <div class="ww-card mb-3">
            <div class="d-flex align-items-center gap-3 mb-3">
              <span class="material-symbols-outlined text-muted">badge</span>
              <div>
                <div class="small text-muted">Role</div>
                <div class="fw-medium" id="profile-role"></div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-3">
              <span class="material-symbols-outlined text-muted">calendar_today</span>
              <div>
                <div class="small text-muted">Bergabung sejak</div>
                <div class="fw-medium" id="profile-joined"></div>
              </div>
            </div>
          </div>
          <button class="btn btn-outline-danger w-100" id="logout-btn">
            <span class="material-symbols-outlined align-middle me-1">logout</span>Keluar
          </button>`;

        // Set via textContent (aman dari XSS)
        document.getElementById('profile-nama').textContent  = u.nama;
        document.getElementById('profile-email').textContent = u.email;
        document.getElementById('profile-role').textContent  = u.role === 'admin' ? 'Admin' : 'Masyarakat';
        document.getElementById('profile-joined').textContent = utils.formatDateShort(u.created_at);

        document.getElementById('logout-btn').addEventListener('click', () => {
          api.clearSession();
          window.location.href = '/';
        });
      } catch (err) {
        document.getElementById('content').innerHTML =
          `<div class="alert alert-danger">${utils.escapeHtml(err?.error?.message || 'Gagal memuat profil.')}</div>`;
      }
    }

    if (payload) loadProfile();
  </script>
</body>
</html>
