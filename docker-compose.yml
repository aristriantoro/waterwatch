# ============================================================
# WaterWatch – Docker Compose
# Layanan: app (Rust/Axum) + postgres:16 + nginx
# ============================================================

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ww-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       waterwatch
      POSTGRES_USER:     waterwatch
      POSTGRES_PASSWORD: waterwatch_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"      # expose ke host untuk debugging (opsional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterwatch -d waterwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ww-net

  # ── Migrasi Database (jalankan sebelum app) ───────────────
  migrate:
    image: postgres:16-alpine
    container_name: ww-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    environment:
      PGPASSWORD: waterwatch_secret
    command: >
      sh -c "
        psql -h postgres -U waterwatch -d waterwatch -f /migrations/20261110000001_init.sql &&
        psql -h postgres -U waterwatch -d waterwatch -f /migrations/20261110000002_seed_categories.sql &&
        echo '✅ Migrasi selesai!'
      "
    networks:
      - ww-net
    restart: "no"        # hanya jalankan sekali

  # ── Integration Tests (jalankan manual: docker compose run --rm test) ──
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder          # pakai stage builder yang punya cargo
      args:
        DATABASE_URL: "postgres://waterwatch:waterwatch_secret@host.docker.internal:5432/waterwatch"
    container_name: ww-test
    depends_on:
      app:
        condition: service_healthy
    environment:
      TEST_SERVER_URL: http://app:8080
      DATABASE_URL: postgres://waterwatch:waterwatch_secret@postgres:5432/waterwatch
      RATE_LIMIT_BURST: 1000     # nonaktifkan throttle saat integration test
    working_dir: /build
    # --test-threads=1 agar test tidak saling ganggu data
    command: ["cargo", "test", "--release", "--", "--test-threads=1", "--nocapture"]
    networks:
      - ww-net
    restart: "no"

  # ── Aplikasi Backend Rust ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ww-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://waterwatch:waterwatch_secret@postgres:5432/waterwatch
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-5}   # default 5; override ke 1000 saat test
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ww-net

  # ── Nginx Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ww-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"          # Akses di http://localhost
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro    # file statis frontend
    networks:
      - ww-net

volumes:
  postgres_data:
    name: ww-postgres-data
  uploads_data:
    name: ww-uploads-data

networks:
  ww-net:
    name: ww-network
    driver: bridge

